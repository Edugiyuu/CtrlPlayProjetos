<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Programação</title>
</head>
<body>
  <h1>Quiz de Programação</h1>

  <main>
    <section id="quiz">
      <p id="progresso">Pergunta 1 de 5</p>
      <h2 id="pergunta">A pergunta aparecerá aqui</h2>
      <div id="alternativas"></div>
      <p id="mensagem"></p>
      <button id="proxima" disabled>Próxima pergunta</button>
    </section>

    <section id="resultado" hidden>
      <h2>Resultado</h2>
      <p id="pontuacao"></p>
      <button id="reiniciar">Jogar novamente</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
