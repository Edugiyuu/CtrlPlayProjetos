<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Herói</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Gerador de Herói</h1>

  <p id="emoji">🦸</p>

  <div class="card amarelo">
    <p class="titulo">🧑 Nome</p>
    <h2 id="caixaNome">?</h2>
  </div>

  <div class="card azul">
    <p class="titulo">🛡️ Classe</p>
    <h2 id="caixaClasse">?</h2>
  </div>

  <div class="card vermelho">
    <p class="titulo">⚔️ Arma</p>
    <h2 id="caixaArma">?</h2>
  </div>

  <div>
    <button onclick="gerar()">🎲 Criar herói</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
