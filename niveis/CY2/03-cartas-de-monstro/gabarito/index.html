<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minhas cartas de monstro</title>
  <style>
    h1 {
      background-color: #1E293B;
      color: #FFFFFF;
      padding: 20px;
    }

    .card {
      padding: 20px;
      margin-bottom: 20px;
      border: 4px solid #1E293B;
      border-radius: 16px;
      transition: 0.3s;
    }

    .card:hover {
      margin-left: 20px;
    }

    .fogo {
      background-color: #FECACA;
    }

    .agua {
      background-color: #BFDBFE;
    }

    .planta {
      background-color: #BBF7D0;
    }

    /* Desafio: o 4º monstro, escrito do zero */
    .eletrico {
      background-color: #FEF08A;
    }
  </style>
</head>
<body>

  <h1>Minhas cartas de monstro</h1>

  <div class="card fogo">
    <h2>Brasa</h2>
    <p>Tipo fogo. Solta faísca quando espirra.</p>
  </div>

  <div class="card agua">
    <h2>Gota</h2>
    <p>Tipo água. Adora pular em poça.</p>
  </div>

  <div class="card planta">
    <h2>Broto</h2>
    <p>Tipo planta. Cresce um pouquinho por dia.</p>
  </div>

  <div class="card eletrico">
    <h2>Zapt</h2>
    <p>Tipo elétrico. Deixa o cabelo de todo mundo em pé.</p>
  </div>

</body>
</html>
