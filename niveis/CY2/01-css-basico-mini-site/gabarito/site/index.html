<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clube do Código</title>
  <style>
    body {
      background-color: #FFFFFF;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .header {
      background-color: #1E293B;
      color: #FFFFFF;
      padding: 20px 24px;
    }

    .menu {
      background-color: #334155;
      padding: 14px 24px;
    }

    .menu a {
      color: #CBD5E1;
      text-decoration: none;
      margin-right: 24px;
    }

    .menu a.ativo {
      color: #38BDF8;
      font-weight: bold;
    }

    .conteudo {
      padding: 24px;
    }

    .titulo {
      color: #0F172A;
    }

    .texto {
      color: #475569;
    }

    .card {
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
    }

    .card-amarelo {
      background-color: #FEF3C7;
    }

    .card-verde {
      background-color: #DCFCE7;
    }

    .caixa {
      background-color: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .destaque {
      background-color: #FCE7F3;
      padding: 20px;
      border-radius: 12px;
    }

    .caixa-azul {
      background-color: #DBEAFE;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .botao {
      background-color: #2563EB;
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
    }

    .rodape {
      background-color: #1E293B;
      color: #94A3B8;
      padding: 20px 24px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Clube do Código</h2>
  </div>

  <div class="menu">
    <a href="index.html" class="ativo">Início</a>
    <a href="sobre.html">Sobre</a>
    <a href="contato.html">Contato</a>
  </div>

  <div class="conteudo">
    <h1 class="titulo">Bem-vindo!</h1>
    <p class="texto">Este é o nosso site. Use o menu lá em cima para passear pelas outras páginas.</p>

    <div class="card card-amarelo">
      <h3>O que a gente faz</h3>
      <p class="texto">Sites, jogos e muita coisa colorida na tela.</p>
    </div>

    <div class="card card-verde">
      <h3>Quando acontece</h3>
      <p class="texto">Toda quarta-feira, depois da aula.</p>
    </div>
  </div>

  <div class="rodape">
    Clube do Código — 2026
  </div>

</body>
</html>
