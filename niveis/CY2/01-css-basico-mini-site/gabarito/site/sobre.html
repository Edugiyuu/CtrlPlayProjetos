<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Sobre — Clube do Código</title>
  <style>
    body {
      background-color: #FFFFFF;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .header {
      background-color: #1E293B;
      color: #FFFFFF;
      padding: 20px 24px;

    .menu {

    .menu a {
      color: #CBD5E1;
      text-decoration: none;

    .menu a.ativo {

    .titulo {
      color: #0F172A;
    }

    .texto {

    }

    .card {

    .card-amarelo {
      background-color: #FEF3C7;

    .card-verde {

      margin-bottom: 20px;
    }

    .destaque {
      background-color: #FCE7F3;

    .caixa-azul {
      background-color: #DBEAFE;
      padding: 20px;

  <div class="menu">

      <ul class="texto">
