<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Menu do jogo</title>
  <style>
    body {
      background-color: #0F172A;
    }

    h1 {
      color: #FFFFFF;
      padding: 20px;
    }

    .botao {
      background-color: #334155;
      color: #FFFFFF;
      padding: 20px;
      margin-bottom: 16px;
      border: 4px solid #FFFFFF;
      border-radius: 12px;
      transition: 0.3s;
    }

    .jogar:hover {
      background-color: #22C55E;
    }

    .opcoes:hover {
      margin-left: 40px;
    }

    .sair:hover {
      background-color: #EF4444;
      border-radius: 40px;
    }

    /* Desafio: o 4º botão, escrito do zero */
    .loja:hover {
      background-color: #EAB308;
      padding: 30px;
    }
  </style>
</head>
<body>

  <h1>Aventura do Pixel</h1>

  <div class="botao jogar">Jogar</div>

  <div class="botao opcoes">Opções</div>

  <div class="botao sair">Sair</div>

  <div class="botao loja">Loja</div>

</body>
</html>
