<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Time de Heróis</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <h1 class="titulo">Time de Heróis</h1>

  <div class="ficha">

    <img class="foto" src="personagem.svg" alt="Foto da Lyra">

    <h2 class="nome">Lyra, a Maga</h2>

    <div class="nivel">Nível 12</div>

    <p class="rotulo">HP 70 / 100</p>
    <div class="barra-fundo">
      <div class="barra-hp hp-70"></div>
    </div>

    <p class="tipo">Classe: Maga · Reino de Aurora</p>

  </div>

  <div class="ficha">

    <img class="foto" src="guerreiro.svg" alt="Foto do Brann">

    <h2 class="nome">Brann, o Bravo</h2>

    <div class="nivel">Nível 8</div>

    <p class="rotulo">HP 30 / 100</p>
    <div class="barra-fundo">
      <div class="barra-hp hp-30"></div>
    </div>

    <p class="tipo">Classe: Guerreiro · Reino de Ferro</p>

  </div>

  <div class="ficha">

    <img class="foto" src="arqueira.svg" alt="Foto da Kira">

    <h2 class="nome">Kira, a Arqueira</h2>

    <div class="nivel">Nível 15</div>

    <p class="rotulo">HP 100 / 100</p>
    <div class="barra-fundo">
      <div class="barra-hp hp-100"></div>
    </div>

    <p class="tipo">Classe: Arqueira · Floresta Verde</p>

  </div>

</body>
</html>
